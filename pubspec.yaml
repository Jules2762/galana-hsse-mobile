name: gestion_hsse
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.3
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo-galana.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo-galana.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo-galana.png
  branding: assets/branding.png

  android: true
  ios: true
  web: true

  android_12:
    color: "#FFFFFF"
    image: assets/logo-galana.png
